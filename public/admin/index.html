<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Celular de Lucía</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<section id="login" class="login">
  <form id="f-login" class="login-caja" autocomplete="off">
    <span class="marca">Caso 001</span>
    <h1>Panel del celular</h1>
    <p>Ingresá la contraseña de administrador que configuraste en Cloudflare.</p>
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" required autocomplete="current-password">
    <p class="error" id="err-login" role="alert" hidden></p>
    <button class="btn prim" type="submit" id="btn-login">Entrar</button>
  </form>
</section>

<div id="panel" class="panel" hidden>
  <header class="top">
    <div class="top-in">
      <div class="titulo"><span class="marca">Caso 001</span><b>Celular de Lucía</b></div>
      <a class="btn" href="/" target="_blank" rel="noopener">Abrir el celular ↗</a>
      <button class="btn" id="btn-salir" type="button">Salir</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <button data-sec="general" class="on">General</button>
      <button data-sec="chats">Chats y audios</button>
      <button data-sec="fotos">Fotos</button>
      <button data-sec="correos">Correos</button>
      <button data-sec="alarma">Alarma</button>
      <button data-sec="codigos">Códigos</button>
      <button data-sec="archivos">Archivos</button>
    </nav>
  </header>
  <main id="main" class="main"></main>
  <div class="guardar" id="barra-guardar">
    <div class="guardar-in">
      <span id="estado-guardado">Todo guardado</span>
      <button class="btn prim" id="btn-guardar" type="button" disabled>Guardar cambios</button>
    </div>
  </div>
</div>
<div class="aviso-flot" id="toast" role="status" hidden></div>

<script src="/admin/admin.js"></script>
</body>
</html>
